name: Flutter

on:
  push:
    branches: [main]
  pull_request:
  # Botón "Run workflow" en la pestaña Actions para compilar sin subir cambios.
  workflow_dispatch:

jobs:
  analizar-y-probar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: flutter analyze
        run: |
          set +e
          flutter analyze > analyze.txt
          code=$?
          cat analyze.txt
          # Cada problema como anotación para verlo sin abrir el log.
          grep -E '^ *(error|warning|info) •' analyze.txt | sed -E 's/^ *(error|warning|info) • /::error title=analyze::/' | head -40
          exit $code
      - name: flutter test
        run: |
          set +e
          flutter test --machine > test-results.jsonl
          code=$?
          # Un aviso por prueba fallida, con lo que imprimió (el detalle del error).
          echo "::notice title=pruebas::$(wc -l < test-results.jsonl) líneas"
          jq -cR 'fromjson? | select(type=="object")' test-results.jsonl > events.jsonl 2> jq1.err
          jq -rs 2> jq2.err '
            (map(select(.type=="testStart")) | map({key: (.test.id|tostring), value: .test.name}) | from_entries) as $names
            | (map(select(.type=="error")) | map(.testID) | unique) as $failed
            | . as $all
            | $failed[] as $id
            | "::error title=" + (($names[($id|tostring)] // "prueba") | gsub("%";"%25") | gsub(":";"%3A") | gsub(",";"%2C"))
              + "::" + ([ $all[] | select((.type=="print" or .type=="error") and .testID==$id) | (.message // ((.error // "") + "\n" + (.stackTrace // ""))) ]
                        | join("\n") | split("\n")
                        | map(select(test("package:flutter|dart:async|package:stack_trace|package:matcher|asynchronous suspension|^\\s*$") | not))
                        | join("\n") | .[0:1800] | gsub("%";"%25") | gsub("\r";"") | gsub("\n";"%0A"))
          ' events.jsonl
          for f in jq1.err jq2.err; do [ -s $f ] && echo "::error title=$f::$(head -c 600 $f | tr '\n' ' ')"; done
          exit $code

  compilar-android:
    runs-on: ubuntu-latest
    needs: analizar-y-probar
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      # Configuración de Firebase: la real viene de un secreto del repositorio
      # (no se sube al código porque el repo es público). Sin el secreto se usa
      # una de prueba: la app compila pero solo ofrece la demostración.
      - name: google-services.json
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "REAL_FIREBASE=true" >> "$GITHUB_ENV"
          else
            cat > android/app/google-services.json <<'JSON'
          {"project_info":{"project_number":"000000000000","project_id":"ci-placeholder","storage_bucket":"ci-placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.javimathesan.familyapp"}},"oauth_client":[],"api_key":[{"current_key":"AIzaPlaceholderPlaceholderPlaceholder00"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
          JSON
          fi

      # Clave de firma de Family App (secreto). Con ella, cada APK nuevo se
      # instala encima del anterior sin perder datos.
      - name: Clave de firma
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=familyapp\nstoreFile=upload-keystore.jks\n' "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_PASSWORD" > android/key.properties
            echo "SIGNED=true" >> "$GITHUB_ENV"
          fi

      # Sin la clave de firma, Gradle firma con la clave de depuración.
      - name: Compilar APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk family-app.apk

      - uses: actions/upload-artifact@v4
        with:
          name: family-app-apk
          path: app/family-app.apk
          retention-days: 7

      # Versión de prueba siempre en el mismo enlace:
      # https://github.com/javimathesan/family_app/releases/download/prueba/family-app.apk
      - name: Publicar versión de prueba
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.REAL_FIREBASE == 'true' && env.SIGNED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Versión de prueba de Family App, compilada automáticamente del commit ${GITHUB_SHA::7} el $(TZ=America/Argentina/Buenos_Aires date '+%d/%m/%Y %H:%M').

          Para instalarla en Android: descargá family-app.apk, abrilo y aceptá instalar desde esta fuente. Se instala encima de la versión anterior sin perder datos."
          if gh release view prueba >/dev/null 2>&1; then
            gh release edit prueba --notes "$NOTES" --prerelease
          else
            gh release create prueba --title "Versión de prueba" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload prueba family-app.apk --clobber
