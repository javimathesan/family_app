name: Flutter

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analizar-y-probar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: flutter test
        run: |
          set +e
          flutter test --machine > test-results.jsonl
          code=$?
          # Publica cada fallo como anotación para verlo sin abrir el log.
          jq -r 'select(.type=="error") | "::error title=Test falló::" + ((.error + "\n" + .stackTrace)[0:1500] | gsub("%";"%25") | gsub("\r";"") | gsub("\n";"%0A"))' test-results.jsonl
          jq -r 'select(.type=="print") | .message' test-results.jsonl | head -c 4000 | sed 's/^/::notice title=Salida::/' | head -20
          exit $code

  compilar-android:
    runs-on: ubuntu-latest
    needs: analizar-y-probar
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Configuración de Firebase de prueba (la real no está en el repo) para
      # verificar que el plugin google-services compila con Gradle.
      - name: google-services.json de prueba
        run: |
          cat > android/app/google-services.json <<'JSON'
          {"project_info":{"project_number":"000000000000","project_id":"ci-placeholder","storage_bucket":"ci-placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.javimathesan.familyapp"}},"oauth_client":[],"api_key":[{"current_key":"AIzaPlaceholderPlaceholderPlaceholder00"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
          JSON
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: family-app-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
