<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Calendario — app del hijo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#1E2235;text-decoration:none}a:hover{color:#1E2235}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6FA; font-family: Nunito, system-ui, sans-serif; color: #1E2235; display: flex; flex-direction: column; overflow: hidden">
  <main style="flex: 1; overflow-y: auto; padding: 56px 20px 24px; display: flex; flex-direction: column; gap: 16px">
    <header style="display: flex; align-items: center; justify-content: space-between">
      <button aria-label="Mes anterior" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E2235" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </button>
      <div style="text-align: center">
        <h1 style="margin: 0; font-size: 24px; font-weight: 800">Octubre 2026</h1>
        <p style="margin: 0; font-size: 13px; font-weight: 700; color: #5B6178">Mi mes en caritas</p>
      </div>
      <button aria-label="Mes siguiente" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E2235" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </header>

    <section style="background: #FFFFFF; border-radius: 24px; padding: 14px 10px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 12px; font-weight: 800; color: #5B6178">
        <span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
          <button onClick="{{c.pick}}" disabled="{{c.disabled}}" aria-label="{{c.label}}" style="height: 52px; border-radius: 14px; border: 2px solid {{c.border}}; background: {{c.bg}}; padding: 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; opacity: {{c.opacity}}">
            <span style="font-size: 11px; font-weight: 800; color: #5B6178">{{c.day}}</span>
            <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" style="visibility: {{c.faceVis}}">
              <circle cx="12" cy="12" r="11" fill="{{c.face}}" stroke="#1E2235" stroke-width="1.2"></circle>
              <circle cx="8.5" cy="9.5" r="1.4" fill="#1E2235"></circle>
              <circle cx="15.5" cy="9.5" r="1.4" fill="#1E2235"></circle>
              <path d="{{c.mouth}}" fill="{{c.mouthFill}}" stroke="#1E2235" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </button>
        </sc-for>
      </div>
    </section>

    <section style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-size: 18px; font-weight: 800">{{sel.title}}</h2>
        <span style="font-size: 16px; font-weight: 800; color: {{accent}}">{{sel.pts}} pts</span>
      </div>
      <p style="margin: 0; font-size: 15px; font-weight: 700">{{sel.summary}}</p>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <div style="background: #F0F4FF; border-radius: 14px; padding: 10px">
          <p style="margin: 0; font-size: 12px; font-weight: 700; color: #5B6178">Agua</p>
          <p style="margin: 0; font-size: 16px; font-weight: 800">{{sel.water}}</p>
        </div>
        <div style="background: #F0F4FF; border-radius: 14px; padding: 10px">
          <p style="margin: 0; font-size: 12px; font-weight: 700; color: #5B6178">Pantallas</p>
          <p style="margin: 0; font-size: 16px; font-weight: 800">{{sel.screen}}</p>
        </div>
        <div style="background: #F0F4FF; border-radius: 14px; padding: 10px">
          <p style="margin: 0; font-size: 12px; font-weight: 700; color: #5B6178">Mi ánimo</p>
          <p style="margin: 0; font-size: 16px; font-weight: 800">{{sel.mood}}</p>
        </div>
      </div>
    </section>

    <section aria-label="Qué significa cada carita" style="display: flex; justify-content: space-between; padding: 0 4px">
      <sc-for list="{{legend}}" as="l" hint-placeholder-count="5">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
          <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="11" fill="{{l.face}}" stroke="#1E2235" stroke-width="1.2"></circle>
            <circle cx="8.5" cy="9.5" r="1.4" fill="#1E2235"></circle>
            <circle cx="15.5" cy="9.5" r="1.4" fill="#1E2235"></circle>
            <path d="{{l.mouth}}" fill="{{l.mouthFill}}" stroke="#1E2235" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          <span style="font-size: 12px; font-weight: 800; color: #5B6178">{{l.label}}</span>
        </div>
      </sc-for>
    </section>
  </main>

  <nav aria-label="Principal" style="height: 84px; flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #E3E6EF; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 20px; box-sizing: border-box">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 700; color: #5B6178">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Hoy</a>
    <a href="Rutina.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 700; color: #5B6178">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8"></path><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"></path></svg>Rutina</a>
    <a href="Calendario.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 800; color: {{accent}}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"></rect><path d="M8 2v4M16 2v4M3 10h18"></path></svg>Calendario</a>
    <a href="Premios.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 700; color: #5B6178">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="2"></rect><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1s6 1 6 1zM12 8c2-4 6-4 6-1s-6 1-6 1z"></path></svg>Premios</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2563EB","options":["#2563EB","#0F766E","#7C3AED","#C2410C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 28 };
  }
  renderVals() {
    const accent = this.props.accent ?? '#2563EB';
    const faces = [
      { face: '#C7D2FE', mouth: 'M7.5 17.5 Q12 12.5 16.5 17.5', mouthFill: 'none', label: '<25%', name: 'Muy triste' },
      { face: '#DBEAFE', mouth: 'M8 16.5 Q12 13.8 16 16.5', mouthFill: 'none', label: '25%', name: 'Triste' },
      { face: '#E5E7EB', mouth: 'M8.5 15.5 H15.5', mouthFill: 'none', label: '50%', name: 'Neutral' },
      { face: '#FEF08A', mouth: 'M8 14 Q12 17.8 16 14', mouthFill: 'none', label: '80%', name: 'Feliz' },
      { face: '#FACC15', mouth: 'M7 13.5 Q12 20 17 13.5 Z', mouthFill: '#FFFFFF', label: '100%', name: 'Muy feliz' }
    ];
    const levels = [4,3,3,4,2,4,4,3,4,4,1,3,4,4,3,4,4,2,3,4,4,3,4,4,4,2,3,4];
    const moods = ['Contento', 'Tranquilo', 'Cansado', 'Contento', 'Contento'];
    const cells = [];
    for (let i = 0; i < 3; i++) {
      cells.push({ day: '', label: 'Sin día', face: '#FFFFFF', mouth: '', mouthFill: 'none', faceVis: 'hidden', border: 'transparent', bg: 'transparent', opacity: 1, disabled: true, pick: () => {} });
    }
    for (let d = 1; d <= 31; d++) {
      const past = d <= 28;
      const today = d === 29;
      const lv = past ? levels[d - 1] : 2;
      const f = faces[lv];
      const sel = this.state.picked === d;
      cells.push({
        day: d,
        label: d + ' de octubre' + (past ? ', ' + f.name : today ? ', hoy en curso' : ', día que viene'),
        face: f.face,
        mouth: f.mouth,
        mouthFill: f.mouthFill,
        faceVis: past ? 'visible' : 'hidden',
        border: sel ? accent : today ? '#93B7FA' : 'transparent',
        bg: today ? '#EEF3FF' : '#FFFFFF',
        opacity: d > 29 ? 0.45 : 1,
        disabled: d > 28,
        pick: () => this.setState({ picked: d })
      });
    }
    const p = this.state.picked;
    const lv = levels[p - 1];
    const pct = [20, 40, 65, 88, 100][lv];
    const sel = {
      title: 'Jueves ' + p + ' de octubre'.replace('Jueves ' + p, ''),
      pts: [25, 48, 70, 96, 118][lv],
      summary: faces[lv].name + ' · cumpliste el ' + pct + '% de tus tareas',
      water: [3, 5, 6, 7, 8][lv] + ' vasos',
      screen: ['3 h 10', '2 h 40', '2 h', '1 h 30', '1 h 15'][lv],
      mood: moods[lv]
    };
    const wd = ['Jueves', 'Viernes', 'Sábado', 'Domingo', 'Lunes', 'Martes', 'Miércoles'][(p - 1) % 7];
    sel.title = wd + ' ' + p + ' de octubre';
    return { accent, cells, sel, legend: faces };
  }
}
</script>
</body>
</html>
